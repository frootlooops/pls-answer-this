<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary Recommendations Dashboard</title>
    <style>
        :root {
            --primary-blue: #1e88e5;
            --dark-blue: #0d47a1;
            --light-blue-bg: #e3f2fd;
            --grid-line: rgba(255, 255, 255, 0.35);
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-blue);
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--light-blue-bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--dark-blue);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--light-blue-bg);
            border-left: 4px solid var(--primary-blue);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Search Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(30, 136, 229, 0.2);
        }

        .btn {
            background-color: var(--dark-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1565c0;
        }

        .btn-danger {
            background-color: #e53935;
        }

        .btn-danger:hover {
            background-color: #c62828;
        }

        /* Data Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: var(--light-blue-bg);
            color: var(--dark-blue);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-rsvp {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .badge-suggestion {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .btn-sm-delete {
            background: #ff5252;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-sm-delete:hover {
            background: #d32f2f;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Itinerary Recommendations</h1>
                <div class="subtitle">Evven Sacapaño • Cavite Visit Dashboard</div>
            </div>

            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Responses</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="topCafe">-</div>
                    <div class="stat-label">Top Suggested Cafe</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="rsvpCount">0</div>
                    <div class="stat-label">Confirmed RSVPs</div>
                </div>
            </div>

            <!-- Filter and Action Controls -->
            <div class="controls">
                <input type="text" id="searchInput" class="search-input" placeholder="Search cafe or notes..." onkeyup="filterRecommendations()">
                <button class="btn" onclick="exportData()">Export Data 📥</button>
                <button class="btn btn-danger" onclick="clearAllData()">Clear All Data</button>
            </div>

            <!-- Recommendations Table -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Suggested Cafe</th>
                            <th>Notes / Message</th>
                            <th>RSVP</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="recommendationsTableBody">
                        <!-- Dynamic content loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Load data from localStorage on initial render
        window.addEventListener('DOMContentLoaded', loadRecommendations);

        function getRecommendations() {
            return JSON.parse(localStorage.getItem('itineraryRecommendations') || '[]');
        }

        function loadRecommendations() {
            const tableBody = document.getElementById('recommendationsTableBody');
            const data = getRecommendations();
            
            updateStats(data);

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            No recommendations or responses logged yet.<br>
                            Submissions made from the main itinerary page will appear here automatically!
                        </td>
                    </tr>`;
                return;
            }

            renderTableRows(data);
        }

        function renderTableRows(items) {
            const tableBody = document.getElementById('recommendationsTableBody');
            tableBody.innerHTML = '';

            items.forEach((item) => {
                const row = document.createElement('tr');
                const isRsvp = item.rsvp ? true : false;

                row.innerHTML = `
                    <td style="color: #666; font-size: 0.85rem;">${escapeHtml(item.timestamp || 'N/A')}</td>
                    <td><strong>${escapeHtml(item.cafe || 'September Brew')}</strong></td>
                    <td>${escapeHtml(item.notes || '-')}</td>
                    <td>
                        <span class="badge ${isRsvp ? 'badge-rsvp' : 'badge-suggestion'}">
                            ${isRsvp ? 'Confirmed 🎉' : 'Suggestion'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-sm-delete" onclick="deleteItem(${item.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateStats(data) {
            document.getElementById('totalCount').innerText = data.length;

            const rsvps = data.filter(d => d.rsvp).length;
            document.getElementById('rsvpCount').innerText = rsvps;

            // Find most frequent cafe recommendation
            if (data.length > 0) {
                const counts = {};
                data.forEach(d => {
                    const c = (d.cafe || 'September Brew').trim();
                    counts[c] = (counts[c] || 0) + 1;
                });
                const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
                document.getElementById('topCafe').innerText = sorted[0];
            } else {
                document.getElementById('topCafe').innerText = '-';
            }
        }

        function filterRecommendations() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const data = getRecommendations();
            const filtered = data.filter(item => 
                (item.cafe && item.cafe.toLowerCase().includes(query)) ||
                (item.notes && item.notes.toLowerCase().includes(query))
            );
            renderTableRows(filtered);
        }

        function deleteItem(id) {
            let data = getRecommendations();
            data = data.filter(item => item.id !== id);
            localStorage.setItem('itineraryRecommendations', JSON.stringify(data));
            loadRecommendations();
        }

        function clearAllData() {
            if (confirm('Are you sure you want to clear all stored recommendations?')) {
                localStorage.removeItem('itineraryRecommendations');
                loadRecommendations();
            }
        }

        function exportData() {
            const data = getRecommendations();
            if (data.length === 0) {
                alert('No data available to export.');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "itinerary_recommendations.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
